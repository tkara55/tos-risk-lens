<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Sözleşme Risk Merceği · Ayarlar</title>
<link rel="stylesheet" href="report.css">
<style>
  .app { max-width: 560px; }
  label { display: block; font-weight: 600; margin-top: 12px; }
  input, select { width: 100%; padding: 7px 8px; margin-top: 4px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; }
  .row { display: flex; gap: 8px; margin-top: 16px; }
  .help { color: var(--muted); font-size: 12.5px; }
</style>
</head>
<body>
<div class="app">
  <h1>Ayarlar</h1>
  <p class="help">Kendi Anthropic API anahtarınızı kullanın. Anahtar yalnızca bu tarayıcıda (chrome.storage.local) saklanır, senkronize edilmez ve hiçbir web sayfasına açılmaz; yalnızca api.anthropic.com'a gönderilir.</p>
  <label for="apiKey">Anthropic API anahtarı</label>
  <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-…">
  <label for="model">Model</label>
  <select id="model">
    <option value="claude-opus-5-5">claude-opus-5-5 (varsayılan)</option>
    <option value="claude-sonnet-5-5">claude-sonnet-5-5</option>
    <option value="claude-haiku-5-5">claude-haiku-5-5</option>
  </select>
  <label for="effort">Çaba (effort)</label>
  <select id="effort">
    <option value="low">low</option>
    <option value="medium">medium (varsayılan)</option>
    <option value="high">high</option>
  </select>
  <div class="row">
    <button id="save" class="primary" type="button">Kaydet</button>
    <button id="clear" type="button">Anahtarı sil</button>
    <span id="msg" class="progress"></span>
  </div>
</div>
<script type="module" src="options.js"></script>
</body>
</html>
