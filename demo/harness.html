<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Risk Merceği Demo</title>
<link rel="stylesheet" href="/dist/report.css">
<style>
  body { display: grid; grid-template-columns: minmax(0, 1fr) 420px; height: 100vh; overflow: hidden; }
  .page { display: flex; flex-direction: column; min-width: 0; border-right: 1px solid var(--line); }
  .tabs { display: flex; gap: 6px; padding: 8px; border-bottom: 1px solid var(--line); background: var(--card); flex-wrap: wrap; align-items: center; }
  .tabs button { border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 14px; padding: 4px 10px; cursor: pointer; font: inherit; font-size: 13px; }
  .tabs button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .mode { margin-left: auto; font-size: 12px; color: var(--muted); }
  iframe { flex: 1; border: 0; width: 100%; background: #fff; }
  .panel { overflow-y: auto; }
  @media (max-width: 800px) { body { grid-template-columns: 1fr; grid-template-rows: 50vh 50vh; } }
</style>
</head>
<body>
<div class="page">
  <div class="tabs" id="tabs">
    <button type="button" data-fixture="akistv-kosullar" data-cy="fx-akistv">AkışTV koşulları</button>
    <button type="button" data-fixture="bulutnot-gizlilik" data-cy="fx-bulutnot">BulutNot (muğlak)</button>
    <button type="button" data-fixture="hizlikargo-enjeksiyon" data-cy="fx-hizlikargo">HızlıKargo (enjeksiyon)</button>
    <span class="mode" id="mode" data-cy="mode"></span>
  </div>
  <iframe id="frame" title="Analiz edilen sayfa"></iframe>
</div>
<div class="panel">
  <div class="app">
    <header class="app-header"><h1>Sözleşme Risk Merceği</h1></header>
    <div id="disclaimer"></div>
    <div class="controls">
      <button id="analyze" class="primary" type="button" data-cy="analyze">Bu sayfayı analiz et</button>
      <span id="progress" class="progress" aria-live="polite" data-cy="progress"></span>
    </div>
    <div id="error" class="error" hidden data-cy="error"></div>
    <div id="report" data-cy="report"></div>
  </div>
</div>
<script type="module" src="/dist/harness.js"></script>
</body>
</html>
